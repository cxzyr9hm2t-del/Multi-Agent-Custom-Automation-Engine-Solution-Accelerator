name: Scheduled Security Sweep

# Runs the checks that were being done by hand during the 2026-08 audit, on a
# schedule, so a vulnerability disclosed against a pinned dependency surfaces
# without anyone remembering to look.
#
# Dependabot already opens PRs for known advisories, so this is not the primary
# alarm — it is the backstop that catches what Dependabot's ecosystem coverage
# misses. Notably it audits the resolved lockfiles rather than the manifests,
# which is where a transitive dependency actually gets pinned.
#
# Each service owns its own dependency set here: a package pinned in one
# pyproject.toml is frequently at a different version in another, and
# .github/requirements.txt is a fourth set used only by CI. Auditing one and
# assuming the rest is exactly how one copy gets hardened while the others stay
# vulnerable, so all four are audited separately.

on:
  schedule:
    # 07:00 UTC Monday — early enough that a weekend disclosure is waiting at
    # the start of the week rather than found on Friday.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python lockfiles
    runs-on: ubuntu-latest
    strategy:
      # Every service is reported even when an earlier one fails; otherwise a
      # single vulnerable lockfile hides the state of the other three.
      fail-fast: false
      matrix:
        include:
          - name: backend
            directory: src/backend
          - name: mcp_server
            directory: src/mcp_server
          - name: App
            directory: src/App
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Install uv and pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install uv pip-audit

      - name: Audit ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          # Audit the resolved lockfile, not the manifest: the manifest states
          # ranges, the lockfile states what would actually be installed.
          uv export --frozen --no-hashes --no-dev -o /tmp/${{ matrix.name }}.txt
          # --no-deps --disable-pip is required, not an optimisation. The export
          # is already a fully resolved closure, and asking pip to re-resolve it
          # fails outright on src/backend: [tool.uv] override-dependencies pins
          # mem0ai==2.0.18 past agent-framework-mem0's `mem0ai<2` cap, which uv
          # honours and pip cannot, so pip returns ResolutionImpossible and the
          # job dies before auditing anything. Without these flags this job has
          # been failing for backend since that override landed.
          pip-audit -r /tmp/${{ matrix.name }}.txt --no-deps --disable-pip

  ci-requirements:
    name: CI requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Audit .github/requirements.txt
        run: |
          set -euo pipefail
          # A fourth, separate dependency set that no service's lockfile covers.
          pip install pip-audit
          pip-audit -r .github/requirements.txt

  infra-requirements:
    name: Infra requirements
    # Two more dependency sets that no service lockfile and no job above covers.
    # They are not incidental: the post-provision scripts run against the real
    # subscription during `azd up`, and pypdf lives here — it parses dataset
    # PDFs in index_datasets.py and has carried advisories before. Auditing the
    # three services and assuming the rest is the same mistake this workflow's
    # header warns about, one directory further out.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - infra/scripts/post-provision/requirements.txt
          - infra/vscode_web/requirements.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Audit ${{ matrix.file }}
        run: |
          set -euo pipefail
          pip install pip-audit
          # No --no-deps here, deliberately. Unlike the lockfile exports above,
          # these files list direct pins only and carry no transitive closure,
          # so letting pip resolve is what surfaces a vulnerable transitive
          # dependency rather than only the fourteen names written down.
          pip-audit -r "${{ matrix.file }}"

  dev-dependencies:
    name: Dev dependencies (advisory)
    # The jobs above export with --no-dev, which is right for "what ships" and
    # wrong for "what we run": it hides eight packages in src/backend alone,
    # among them pytest — whose GHSA-6w46-j5rx-g56g was a real finding here and
    # was fixed by bumping to 9.0.3. A test-tool advisory is not a production
    # incident, so this reports without blocking; the jobs above still gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            directory: src/backend
          - name: mcp_server
            directory: src/mcp_server
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Install uv and pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install uv pip-audit

      - name: Audit ${{ matrix.name }} including dev dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          # --all-extras covers mcp_server's [project.optional-dependencies];
          # omitting --no-dev covers backend's [dependency-groups]. Both are
          # needed because the two services declare their test toolchain
          # differently. --no-emit-project drops the '-e .' self-reference,
          # which pip-audit has no version to check.
          uv export --frozen --no-hashes --all-extras --no-emit-project \
            -o /tmp/${{ matrix.name }}-dev.txt
          # Same flags, same reason as the production job above.
          pip-audit -r /tmp/${{ matrix.name }}-dev.txt --no-deps --disable-pip

  frontend-dependencies:
    name: Frontend packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/App
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/App/package-lock.json

      - name: Audit production dependencies
        run: |
          set -euo pipefail
          # --omit=dev: a vulnerability in a build-time package does not ship to
          # a user. Drop the flag if you want the dev tree gated too.
          npm audit --omit=dev
